# Builds Solo for Linux (AppImage) and Windows (installer and zip) and publishes them as a GitHub release.
# Push a tag such as v0.2.0 to release that version; run it by hand to build without releasing.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools nsis

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          (cd sidecar && bun install --frozen-lockfile && bun test)
          (cd relay && bun install --frozen-lockfile && bun run test)
          go test ./...

      # What Solo deploys for remote access, the relay and the web client, built into the app.
      - name: Relay and web client
        run: go mod download && ./scripts/bundle.sh

      - name: Linux AppImage
        run: VERSION=${{ steps.version.outputs.version }} ./scripts/appimage.sh

      - name: Windows installer and zip
        run: VERSION=${{ steps.version.outputs.version }} ./scripts/windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: solo-${{ steps.version.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*-setup.exe
            dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
