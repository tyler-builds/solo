# Builds Solo for Linux (AppImage) and Windows (installer and zip) and publishes them as a GitHub release.
# Push a tag such as v0.2.0 to release that version; run it by hand to build without releasing.
#
# What is built here is what users run, and holds what they deploy for remote access (the relay and the
# web client, which keeps their devices' keys). So the actions are pinned to commits, the build can
# only read the repository, and the job that can write to it does nothing but publish the build's files.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools nsis

      # The version is the tag's, and only if the tag is a plain version: a tag's name is text
      # someone chose, and never goes into a command as anything but a variable.
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="0.0.0"
          if [[ "$REF_TYPE" == tag ]]; then v="${REF_NAME#v}"; fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "not a version: refusing to build" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          (cd sidecar && bun install --frozen-lockfile && bun test)
          (cd relay && bun install --frozen-lockfile && bun run test)
          go test ./...

      # What Solo deploys for remote access, the relay and the web client, built into the app.
      - name: Relay and web client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: go mod download && ./scripts/bundle.sh

      - name: Linux AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/appimage.sh

      - name: Windows installer and zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/windows.sh

      - name: Checksums
        run: cd dist && sha256sum *.AppImage *-setup.exe *.zip > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solo-${{ steps.version.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: solo-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.AppImage
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
